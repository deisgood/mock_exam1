# NCA-AIIO Mock Exam — 정적 SPA 서빙
# 위치: /etc/nginx/conf.d/nca-exam.conf
#
# server_name을 IP로 지정해 AL2023 기본 nginx.conf의 default server(:80)와
# 충돌하지 않게 한다 (Host가 정확히 일치하면 default_server보다 우선).
# 도메인이 생기면 server_name에 도메인을 추가하고 certbot을 돌리면 된다.

server {
    listen 80;
    listen [::]:80;
    server_name 15.165.3.90;   # TODO: 도메인 확보 후 "example.com 15.165.3.90" 으로

    root /var/www/nca-exam;
    index index.html;

    # ---- Basic Auth (HTTPS 적용 후에 주석 해제할 것 — HTTP에서는 평문 노출) ----
    # auth_basic "NCA-AIIO Mock Exam";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # gzip — JS 411KB → 약 135KB
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 폴백 — 새로고침/딥링크가 index.html로 떨어지게
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시 파일명(assets)은 영구 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 배포 즉시 반영돼야 하므로 캐시 금지
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 보안 헤더 (정적 사이트 기본)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
